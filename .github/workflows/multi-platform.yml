name: Build Geode Mod

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Android32
          os: ubuntu-latest
          target: Android32
          abi: armeabi-v7a
          min-sdk: 24

        - name: Android64
          os: ubuntu-latest
          target: Android64
          abi: arm64-v8a

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Own The Libs (Checkout)
        uses: actions/checkout@v4
        with:
          repository: ccchanged/ffmpeg-libs
          ref: ${{ matrix.config.name }}
          token: ${{ secrets.FFMPEG_LIBS_TOKEN }}
          path: ffmpeg-libs

      - name: Own The Libs (Extract)
        run: |
          # Works whatever folder layout lib.7z has inside: every lib*.a is copied to lib/<abi>/,
          # which is where CMakeLists.txt looks for them.
          7z x ffmpeg-libs/lib/lib.7z -olib_extracted
          echo "--- contents of lib.7z:"
          find lib_extracted | sort
          mkdir -p lib/${{ matrix.config.abi }}
          find lib_extracted -type f -name 'lib*.a' -exec cp -v {} lib/${{ matrix.config.abi }}/ \;
          echo "--- prepared lib/${{ matrix.config.abi }}:"
          ls -la lib/${{ matrix.config.abi }}

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}
          android-min-sdk: ${{ matrix.config.min-sdk || 23 }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
